<title>Tempat Sementara</title>

<style>
:root{
  --ink:#1c1920;
  --ink-2:#26222b;
  --ash:#d3cfca;
  --fox:#fcf4e4;
  --coral:#f0766a;
  --sakura:#eab9b5;
  --gold:#e9b862;
  --serif:"Shippori Mincho",Georgia,"Times New Roman",serif;
  --sans:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink)}
body{
  min-height:100vh;
  font-family:var(--sans);
  color:var(--fox);
  background:
    radial-gradient(60% 40% at 50% 0%,rgba(240,118,106,.16),transparent 70%),
    radial-gradient(50% 35% at 50% 100%,rgba(234,185,181,.08),transparent 70%),
    var(--ink);
  overflow-x:hidden;
}
.wrap{max-width:440px;margin:0 auto;padding:56px 20px 40px}

/* hero */
.hero{position:relative;display:grid;place-items:center;height:min(92vw,400px)}
.ring{position:absolute;width:min(92vw,400px);aspect-ratio:1;animation:turn 300s linear infinite}
.ring text{font-family:var(--serif);font-size:20px;fill:var(--ash);opacity:.32;text-anchor:middle}
.ring line{stroke:var(--ash);opacity:.22}
.ring circle{fill:none;stroke:var(--ash);opacity:.2}
@keyframes turn{to{transform:rotate(360deg)}}
.logo{
  position:relative;width:52%;aspect-ratio:1;border-radius:50%;overflow:hidden;
  box-shadow:0 0 0 3px rgba(252,244,228,.14),0 18px 60px rgba(240,118,106,.25);
  background:var(--ash);
}
.logo img{display:block;width:112%;margin:-6% 0 0 -6%}

.title{text-align:center;margin-top:8px}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,9vw,38px);letter-spacing:.02em;line-height:1.15}
.title p{margin-top:10px;color:var(--sakura);font-size:15px;line-height:1.6}

/* links */
.links{list-style:none;margin-top:36px;display:grid;gap:12px}
.link{
  display:flex;align-items:center;gap:16px;
  padding:16px 18px;border-radius:14px;
  background:var(--fox);color:var(--ink);text-decoration:none;
  border-left:6px solid var(--coral);
  transition:transform .18s ease,background .18s ease;
}
.link:hover{transform:translateX(4px);background:#fff}
.link:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.link svg{flex:none;width:30px;height:30px;color:var(--coral)}
.link b{display:block;font-family:var(--serif);font-size:18px;line-height:1.25}
.link span{display:block;margin-top:2px;font-size:13.5px;color:#5b5460}
.link.main{background:var(--coral);color:#fff;border-left-color:var(--gold)}
.link.main:hover{background:#f4867b}
.link.main svg{color:var(--fox)}
.link.main span{color:rgba(255,255,255,.88)}

footer{margin-top:40px;text-align:center;font-size:13px;color:var(--ash);opacity:.7;line-height:1.6}

@media (prefers-reduced-motion:reduce){
  .ring{animation:none}
  .link{transition:none}
}
</style>
</head>
